[package]
name = "my-postico"
version = "0.2.0"
description = "A focused PostgreSQL, MySQL and MariaDB desktop client"
authors = ["My Postico"]
edition = "2021"

[lib]
name = "my_postico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
postgres-native-tls = "0.5"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
tokio = { version = "1", features = ["time"] }
native-tls = "0.2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
keyring = { version = "3", features = ["apple-native"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
